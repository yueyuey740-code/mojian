<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>墨间 · 来源</title><style>body{max-width:760px;margin:8vh auto;padding:24px;background:#f5f1e7;color:#29271f;font:17px/1.9 serif}a{color:#8a422c}</style><a href="./">← 回到墨间</a><h1>展品与技术来源</h1><p>展品图像来自大都会艺术博物馆公共领域藏品。每件新增展品的详情页均附馆藏链接，原有三件的链接位于细读展厅。展品名称使用中文描述，作品归属以馆方记录为准。</p><p>自由书写使用 <a href="https://github.com/szimek/signature_pad">szimek/signature_pad</a>，以速度变化生成粗细不同的平滑笔迹。<a href="signature-pad-LICENSE.txt">MIT 许可证</a>。它提供数字书写体验。</p><p>画廊探索参考 <a href="https://github.com/surya-aditya/codrops-infinite-scroll-and-content-transition">Codrops Infinite Scroll Gallery</a> 的空间式浏览思路，本网站的画廊布局与交互代码为独立实现。</p></html>
